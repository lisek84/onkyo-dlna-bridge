# onkyo-dlna-bridge - Docker Compose / Podman Compose
#
#   cp soloist.env.example soloist.env    # then edit it (API key, receiver IP, ...)
#   docker compose up -d --build
#   docker compose logs -f
#
# Raspberry Pi / other ARM hosts: set "dockerfile: Dockerfile.arm" below.
# Synology DSM: use deploy/synology/ instead (see docs/synology.md).

services:
  onkyo-dlna-bridge:
    build:
      context: ./image
      dockerfile: Dockerfile          # Dockerfile.arm on arm64 / armv7 (Raspberry Pi)
    image: local/onkyo-dlna-bridge:latest
    container_name: onkyo-dlna-bridge
    # Host networking is required: Spotify Connect discovery (mDNS) and the
    # receiver's DLNA renderer only work on the real LAN interface.
    network_mode: host
    env_file:
      - soloist.env
    volumes:
      - ./config:/config
    restart: unless-stopped
